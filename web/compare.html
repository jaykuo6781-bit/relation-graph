<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>三档对比 · 选一个</title>
<link rel="stylesheet" href="/style.css">
<style>
  /* 这是一个临时页面,定稿后会删掉,所以样式就地写在这里,不污染主样式表 */
  body{display:block;overflow-y:auto;background:var(--bg-0)}
  .wrap{max-width:1180px;margin:0 auto;padding:22px 16px 60px}
  h1{font-size:20px;margin:0 0 6px;font-weight:650}
  .lead{color:var(--dim);font-size:13.5px;line-height:1.75;margin:0 0 20px}
  .lead b{color:var(--text-2)}
  .bar{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}
  .panel{margin-bottom:26px}
  .phead{display:flex;align-items:baseline;gap:12px;margin-bottom:8px}
  .phead h2{font-size:17px;margin:0;font-weight:650}
  .phead .tag{margin:0}
  .pdesc{color:var(--dim);font-size:12.5px;margin-bottom:10px;line-height:1.7}
  .frame{
    border:1px solid var(--line);border-radius:16px;overflow:hidden;
    height:min(56vh,460px);position:relative;
    background:
      radial-gradient(ellipse 62% 46% at 28% 30%,
        rgba(24,120,150,.20) 0%, transparent 62%),
      radial-gradient(ellipse 54% 42% at 76% 68%,
        rgba(88,72,190,.18) 0%, transparent 60%),
      radial-gradient(ellipse 96% 78% at 50% 46%,
        var(--stage-in) 0%, var(--stage-out) 78%);
  }
  :root[data-theme="light"] .frame{
    background:
      radial-gradient(ellipse 62% 46% at 28% 30%,
        rgba(20,150,175,.07) 0%, transparent 62%),
      radial-gradient(ellipse 54% 42% at 76% 68%,
        rgba(90,80,190,.06) 0%, transparent 60%),
      radial-gradient(ellipse 96% 78% at 50% 46%,
        var(--stage-in) 0%, var(--stage-out) 78%);
  }
  .frame svg{display:block;width:100%;height:100%}
  .err{color:var(--neg);padding:20px;font-size:14px;line-height:1.8}
</style>
</head>
<body>
<div class="wrap">
  <h1>三档对比 —— 挑一个告诉我</h1>
  <p class="lead">
    同一份真实数据(<b id="meta">载入中…</b>),用<b>同一份渲染代码</b>画三遍,
    只有浓淡参数不同 —— 所以你在这里看到的,就是你会得到的。<br>
    可以直接说 <b>A</b> / <b>B</b> / <b>C</b>,也可以混搭,
    比如"<b>A 的球配 C 的连线</b>"或"<b>B,但星点再少一点</b>"。
  </p>
  <div class="bar">
    <button class="btn" id="themeBtn">切浅色看看</button>
    <button class="btn" id="facBtn">按派系着色</button>
    <a class="btn" href="/" style="text-decoration:none;text-align:center">← 回主界面</a>
  </div>
  <div id="panels"></div>
</div>

<script src="/graph.js"></script>
<script>
const DESC = {
  A: "球最大、光晕最强、连线最亮、星点最多。最接近你发我的那张参考图,冲击力强,但人一多容易糊。",
  B: "各项居中。在「有氛围」和「看得清」之间取平衡。",
  C: "球较小、光晕紧贴、连线细而清晰、星点很少。最耐看、人多时最稳,但没那么惊艳。",
};

function bboxOf(nodes, nameSize) {
  let a = Infinity, b = -Infinity, c = Infinity, d = -Infinity;
  for (const n of nodes) {
    const hw = Math.max(n.r, n.name.length * nameSize * 0.56 / 2) + 8;
    a = Math.min(a, n.x - hw); b = Math.max(b, n.x + hw);
    c = Math.min(c, n.y - n.r - 8); d = Math.max(d, n.y + n.r + nameSize + 14);
  }
  return { minX: a, maxX: b, minY: c, maxY: d };
}

let payload = null;

async function boot() {
  const host = document.getElementById("panels");
  try {
    const st = await (await fetch("/api/state")).json();
    const circle = st.circles.find(c => c.relations > 0) || st.circles[0];
    if (!circle) throw new Error("库里还没有数据 —— 先去设置页载入演示数据");
    payload = await (await fetch(
      `/api/graph?circle=${circle.id}&aspect=1.7`)).json();
    if (payload.error) throw new Error(payload.error);
    if (!payload.nodes.length) throw new Error("这个圈子还没有人");
    document.getElementById("meta").textContent =
      `${circle.name} · ${payload.nodes.length} 人 · ${payload.edges.length} 条关系`;
  } catch (e) {
    host.innerHTML = `<div class="err">载入失败:${e.message}</div>`;
    return;
  }

  host.innerHTML = ["A", "B", "C"].map(k => {
    const s = GraphStyles[k];
    return `<div class="panel">
      <div class="phead"><h2>${s.name}</h2>
        <span class="tag">球 ${s.ball}× · 光晕 ${s.glow}× · 线 ${s.edgeW}× ·
          星点 ${s.stars}</span></div>
      <div class="pdesc">${DESC[k]}</div>
      <div class="frame"><svg id="svg${k}"></svg></div>
    </div>`;
  }).join("");

  paint();
}

function paint() {
  for (const k of ["A", "B", "C"]) {
    const s = GraphStyles[k];
    const svg = document.getElementById("svg" + k);
    const b = bboxOf(payload.nodes, s.nameSize);
    const pad = 26;
    const vw = b.maxX - b.minX + pad * 2, vh = b.maxY - b.minY + pad * 2;
    svg.setAttribute("viewBox",
      `${b.minX - pad} ${b.minY - pad} ${vw} ${vh}`);
    svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
    // 字号补偿:SVG 被自动缩放到面板宽度,把这个比例写进 --gscale
    const shown = svg.getBoundingClientRect();
    const gs = shown.width > 0 ? (shown.width / vw) : 1;
    svg.style.setProperty("--gscale", gs.toFixed(3));
    svg.innerHTML = GraphRender.buildSVG(payload, s, k + "_");
    if (byFaction) applyFaction(svg, k);
  }
}

let byFaction = false;
function applyFaction(svg, k) {
  svg.querySelectorAll(".node").forEach(g => {
    if (g.classList.contains("me")) return;
    const ball = g.querySelector(".ball"), glow = g.querySelector(".glow");
    ball.setAttribute("fill", `url(#${ball.dataset.fac})`);
    glow.setAttribute("fill", `url(#${glow.dataset.fac})`);
  });
}

document.getElementById("themeBtn").onclick = () => {
  const root = document.documentElement;
  const next = root.getAttribute("data-theme") === "light" ? "dark" : "light";
  root.setAttribute("data-theme", next);
  document.getElementById("themeBtn").textContent =
    next === "light" ? "切回深色" : "切浅色看看";
};
document.getElementById("facBtn").onclick = () => {
  byFaction = !byFaction;
  document.getElementById("facBtn").textContent =
    byFaction ? "回到统一配色" : "按派系着色";
  paint();
};

window.addEventListener("resize", () => { if (payload) paint(); });
boot();
</script>
</body>
</html>
