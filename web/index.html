<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="关系图">
<meta name="theme-color" content="#0a0a0c">
<script>
  // 在样式表加载前就把主题定下来,避免打开时闪一下白屏
  try {
    document.documentElement.setAttribute(
      "data-theme", localStorage.getItem("theme") || "dark");
  } catch (e) {}
</script>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<title>关系图</title>
</head>
<body>

<header id="topbar">
  <button id="circleBtn"></button>
  <div class="spacer"></div>
  <button id="facBtn" class="icon-btn" title="灰阶 / 按派系着色">◐</button>
  <button id="themeBtn" class="icon-btn" title="深色 / 浅色">☀</button>
  <button id="fitBtn" class="icon-btn" title="复位">⊹</button>
  <button id="maskBtn" class="icon-btn" title="打码 / 取消打码">🕶</button>
</header>
<div id="circleMenu" class="hidden"></div>

<main id="views">

  <!-- ================= 图谱 ================= -->
  <section class="view" id="view-graph">
    <div id="stage">
      <div id="canvas"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
      <div id="legend"></div>
      <div id="graphEmpty" class="empty hidden">
        <h3>这个圈子还是空的</h3>
        <p style="margin:0">在下面说一句话,让 AI 帮你把关系理出来;<br>
          或者去设置页批量导入名单。</p>
        <button class="btn" onclick="loadSeed()">先看看演示数据</button>
      </div>
    </div>

    <div id="aibar">
      <div id="aiFiles" class="hidden"></div>
      <div class="ai-row">
        <textarea id="aiInput" rows="1"
          placeholder="说点什么,或丢一张聊天截图…"></textarea>
        <button class="ai-btn" id="aiAttach" title="上传截图或文档">📎</button>
        <button class="ai-btn send" id="aiSend" title="交给 AI">↑</button>
      </div>
      <input type="file" id="aiFile" class="hidden" multiple
             accept="image/*,.txt,.md,.csv,.log,.pdf,.docx">
    </div>
  </section>

  <!-- ================= 人物 ================= -->
  <section class="view hidden" id="view-people">
    <div class="pad"><div class="pad-inner">
      <input id="peopleSearch" class="input" placeholder="搜索姓名 / 部门 / 职位"
             autocomplete="off" oninput="renderPeople()">
      <div id="peopleList" class="list" style="margin-top:12px"></div>
    </div></div>
  </section>

  <!-- ================= 设置 ================= -->
  <section class="view hidden" id="view-settings">
    <div class="pad"><div class="pad-inner" id="settingsBody"></div></div>
  </section>

  <!-- 弹出卡片(人物 / 连线 / AI 审核 共用) -->
  <div id="sheet" class="sheet hidden"></div>

</main>

<nav id="tabbar">
  <button class="navbtn on" data-view="graph"><i>🕸</i><span>图谱</span></button>
  <button class="navbtn" data-view="people"><i>👤</i><span>人物</span></button>
  <button class="navbtn" data-view="settings"><i>⚙</i><span>设置</span></button>
</nav>

<div id="toast" class="hidden"></div>
<div id="busy" class="hidden"><div class="box"></div></div>

<script src="/graph.js"></script>
<script src="/app.js"></script>
</body>
</html>
