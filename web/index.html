<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="关系图">
<meta name="theme-color" content="#080c18">
<script>
  // 在样式表加载前就把主题定下来,避免打开时闪一下白屏
  try {
    document.documentElement.setAttribute(
      "data-theme", localStorage.getItem("theme") || "dark");
  } catch (e) {}
</script>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<title>关系图</title>
</head>
<body>

<!-- ============================================================
     图标雪碧图。同文档 <symbol> + <use>。

     为什么不拆成独立的 sprite.svg:**iOS Safari 至今不支持跨文档 <use>**,
     那样就得配 polyfill,等于引入依赖,违反本项目的零构建原则。

     为什么不用 emoji(之前就是):emoji 走的是彩色字体,忽略 CSS 的 color。
     顶栏原来 ◐ ☀ ⊹ 是文本字形、🕶 是彩色 emoji,四个按钮里三个能被
     .icon-btn.on 染成强调色、一个不能,选中态表现不一致;而且它们分别
     来自不同的 fallback 字体,基线和粗细都对不齐。
     stroke/fill 是**可继承的呈现属性**,能穿过 <use> 的影子树,
     所以下面这些图标写 stroke="currentColor" 就自动吃 color 了。
     ============================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"
     style="position:absolute;width:0;height:0;overflow:hidden">
  <symbol id="i-sun" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="4"/>
    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
  </symbol>
  <symbol id="i-moon" viewBox="0 0 24 24">
    <path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/>
  </symbol>
  <symbol id="i-fit" viewBox="0 0 24 24">
    <path d="M4 9V5.5A1.5 1.5 0 015.5 4H9M15 4h3.5A1.5 1.5 0 0120 5.5V9M20 15v3.5a1.5 1.5 0 01-1.5 1.5H15M9 20H5.5A1.5 1.5 0 014 18.5V15"/>
    <circle cx="12" cy="12" r="2.5"/>
  </symbol>
  <symbol id="i-mask" viewBox="0 0 24 24">
    <path d="M2.5 12S6 5.5 12 5.5c1.6 0 3 .47 4.2 1.16M21.5 12s-1.3 2.4-3.6 4.2M9.9 9.9a3 3 0 104.2 4.2"/>
    <path d="M3 3l18 18"/>
  </symbol>
  <symbol id="i-graph" viewBox="0 0 24 24">
    <circle cx="12" cy="5" r="2.4"/><circle cx="5" cy="17" r="2.4"/>
    <circle cx="19" cy="17" r="2.4"/>
    <path d="M10.6 7L6.4 14.9M13.4 7l4.2 7.9M7.4 17h9.2"/>
  </symbol>
  <symbol id="i-person" viewBox="0 0 24 24">
    <circle cx="12" cy="8" r="3.6"/>
    <path d="M4.5 20a7.5 7.5 0 0115 0"/>
  </symbol>
  <symbol id="i-gear" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="3"/>
    <path d="M19.9 15a1.7 1.7 0 00.34 1.87l.06.06a1.9 1.9 0 11-2.7 2.7l-.06-.06a1.7 1.7 0 00-2.9 1.2V21a1.9 1.9 0 11-3.8 0v-.1a1.7 1.7 0 00-2.9-1.2l-.06.06a1.9 1.9 0 11-2.7-2.7l.06-.06A1.7 1.7 0 003 15H3a1.9 1.9 0 110-3.8h.1a1.7 1.7 0 001.2-2.9l-.06-.06a1.9 1.9 0 112.7-2.7l.06.06A1.7 1.7 0 0010 4.5V4a1.9 1.9 0 013.8 0v.1a1.7 1.7 0 002.9 1.2l.06-.06a1.9 1.9 0 012.7 2.7l-.06.06a1.7 1.7 0 001.2 2.9H21a1.9 1.9 0 010 3.8h-.1a1.7 1.7 0 00-1.2 1z"/>
  </symbol>
  <!-- 局势页。旗子:阵地、战线、谁跟谁对着 —— 一眼能和「图谱」(三个球)、
       「复位」(四角+准心)区分开,不靠细节辨认。 -->
  <symbol id="i-flag" viewBox="0 0 24 24">
    <path d="M5.5 21.5V3.5"/>
    <path d="M5.5 4.6h12.2l-2.7 4 2.7 4H5.5"/>
  </symbol>
  <symbol id="i-caret" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-attach" viewBox="0 0 24 24">
    <path d="M20 11.5l-8.4 8.4a5 5 0 01-7.1-7.1l9.2-9.2a3.4 3.4 0 014.8 4.8l-9.2 9.2a1.7 1.7 0 01-2.4-2.4l8.5-8.5"/>
  </symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
  <symbol id="i-palette" viewBox="0 0 24 24">
    <path d="M12 3a9 9 0 100 18c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1a1.5 1.5 0 011.11-2.5H16a5 5 0 005-5c0-4.42-4.03-8-9-8z"/>
    <circle cx="7.5" cy="11.5" r="1" fill="currentColor" stroke="none"/>
    <circle cx="10.5" cy="7.5" r="1" fill="currentColor" stroke="none"/>
    <circle cx="15" cy="8" r="1" fill="currentColor" stroke="none"/>
  </symbol>
</svg>

<header id="topbar">
  <button id="circleBtn" aria-haspopup="true" aria-expanded="false"
          aria-controls="circleMenu"></button>
  <div class="spacer"></div>
  <!-- 顶栏只留三个:复位和打码是**看图过程中**要按的,主题是随光线环境
       随手改的。派系着色是"设定一次"的偏好,已挪到设置页做成带文字的开关
       —— 触屏上 title 永远不显示,一排看不懂的符号让人无从下手。 -->
  <button id="themeBtn" class="icon-btn" title="深色 / 浅色"
          aria-label="切换到浅色主题">
    <svg class="ic" aria-hidden="true"><use href="#i-sun"/></svg></button>
  <button id="fitBtn" class="icon-btn" title="复位"
          aria-label="把图复位到刚好铺满屏幕">
    <svg class="ic" aria-hidden="true"><use href="#i-fit"/></svg></button>
  <button id="maskBtn" class="icon-btn" title="打码 / 取消打码"
          aria-label="给人名打码" aria-pressed="false">
    <svg class="ic" aria-hidden="true"><use href="#i-mask"/></svg></button>

  <!-- 必须放在 #topbar **内部**。它 position:absolute;top:100%,而定位参照的是
       最近的已定位祖先 —— #topbar 有 position:relative,body 没有。
       之前它是 <header> 的兄弟,参照系变成初始包含块(视口大小),
       top:100% 就等于视口高度,菜单整个落到屏幕外,点了像没反应。 -->
  <div id="circleMenu" class="hidden" role="menu"></div>
</header>

<main id="views">

  <!-- ================= 图谱 ================= -->
  <section class="view" id="view-graph">
    <div id="stage">
      <div id="canvas"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
      <div id="legend"></div>
      <div id="graphEmpty" class="empty hidden">
        <h3>这个圈子还是空的</h3>
        <p style="margin:0">在下面说一句话,让 AI 帮你把关系理出来;<br>
          或者去设置页批量导入名单。</p>
        <button class="btn" onclick="loadSeed()">先看看演示数据</button>
      </div>
    </div>

    <div id="aibar">
      <div id="aiFiles" class="hidden"></div>
      <div class="ai-row">
        <textarea id="aiInput" rows="1"
          placeholder="说点什么,或丢一张聊天截图…"></textarea>
        <!-- 手动录入入口。挤在附件键左边,**送出键的位置一点不动** ——
             那是肌肉记忆。也不做悬浮 FAB:右下角被送出键占着,左下角是图例。
             「AI 录一笔」和「手动录一笔」本来就该在同一个容器里。 -->
        <button class="ai-btn" id="aiPlus" title="手动录入"
                aria-label="手动录入人物、关系或一笔事情">
          <svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg></button>
        <button class="ai-btn" id="aiAttach" title="上传截图或文档"
                aria-label="上传截图或文档">
          <svg class="ic" aria-hidden="true"><use href="#i-attach"/></svg></button>
        <button class="ai-btn send" id="aiSend" title="交给 AI" aria-label="交给 AI">
          <svg class="ic" aria-hidden="true"><use href="#i-send"/></svg></button>
      </div>
      <input type="file" id="aiFile" class="hidden" multiple
             accept="image/*,.txt,.md,.csv,.log,.pdf,.docx">
    </div>
  </section>

  <!-- ================= 局势 =================
       内容全部由 renderSituation 填。这一页只发 GET /api/analysis/situation,
       **不搭 /api/graph 的车** —— 后者是全项目最慢的接口,而且每次 resize、
       每次切圈子都会重发。 -->
  <section class="view hidden" id="view-situation">
    <div class="pad"><div class="pad-inner" id="situationBody"></div></div>
  </section>

  <!-- ================= 人物 ================= -->
  <section class="view hidden" id="view-people">
    <div class="pad"><div class="pad-inner">
      <!-- 搜没搜到都在这儿:搜不到正是最想新建的时刻 -->
      <div class="hstack">
        <input id="peopleSearch" class="input grow" placeholder="搜索姓名 / 部门 / 职位"
               autocomplete="off" oninput="renderPeople()">
        <button class="btn" id="newPersonBtn">＋ 新建</button>
      </div>
      <div id="peopleList" class="list" style="margin-top:12px"></div>
    </div></div>
  </section>

  <!-- ================= 设置 ================= -->
  <section class="view hidden" id="view-settings">
    <div class="pad"><div class="pad-inner" id="settingsBody"></div></div>
  </section>

  <!-- 弹出卡片(人物 / 连线 / AI 审核 共用) -->
</main>

<!-- 用原生 <dialog> + showModal() 而不是自己写浮层:
     焦点陷阱、Esc 关闭、背景 inert、top layer —— 这四样全是浏览器给的,
     手写要 60 多行而且容易漏。iOS Safari 15.4(2022-03)起支持 ::backdrop。

     ::backdrop 那层压暗是最要紧的收益:深色 UI 里黑底上的黑阴影几乎不可见,
     以前卡片和背后的图糊在一起,层次全靠 1px 边框撑着。 -->
<dialog id="sheet" class="sheet">
  <div class="sheet-head">
    <div class="sheet-grab" aria-hidden="true"></div>
    <button class="close" id="sheetClose" aria-label="关闭">
      <svg class="ic sm" aria-hidden="true"><use href="#i-close"/></svg>
    </button>
  </div>
  <!-- autofocus 落在滚动容器上:dialog 打开时会自动聚焦第一个可聚焦元素,
       而 AI 审核卡片里第一个是复选框 —— 那会把内容直接滚过去。 -->
  <div class="sheet-body" id="sheetBody" tabindex="-1" autofocus></div>
</dialog>

<!-- 四个 tab 零 CSS 改动就装得下:#tabbar 是 flex、.navbtn 是 flex:1,
     iPhone SE(320px)上各 80px,桌面走 flex:0 0 130px 居中,4×130=520 也够。
     「局势」排第二 —— 使用频率仅次于图谱;设置留在最右,它最不常用,
     而大屏手机右下角恰好是拇指最难够到的地方。 -->
<nav id="tabbar" role="tablist">
  <button class="navbtn on" data-view="graph" aria-current="page">
    <svg class="ic lg" aria-hidden="true"><use href="#i-graph"/></svg><span>图谱</span></button>
  <button class="navbtn" data-view="situation">
    <svg class="ic lg" aria-hidden="true"><use href="#i-flag"/></svg><span>局势</span></button>
  <button class="navbtn" data-view="people">
    <svg class="ic lg" aria-hidden="true"><use href="#i-person"/></svg><span>人物</span></button>
  <button class="navbtn" data-view="settings">
    <svg class="ic lg" aria-hidden="true"><use href="#i-gear"/></svg><span>设置</span></button>
</nav>

<!-- 必须是 <dialog>:卡片用 showModal() 之后在 top layer,普通元素的
     z-index 再高也盖不住它 —— 而 19 处 toast 是在卡片开着时触发的,
     其中包括替代 confirm() 的那个「撤销」。非模态的 .show() 同样进
     top layer,但不抢焦点、不加遮罩、不拦背后的点击。 -->
<dialog id="toast" aria-live="polite"></dialog>
<div id="busy" class="hidden"><div class="box"></div></div>

<script src="/graph.js"></script>
<script src="/app.js"></script>
</body>
</html>
